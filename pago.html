<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Pago</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5dc;
      color: #333;
      padding: 40px;
    }
    h1 {
      color: #bb8fce;
    }
    form {
      max-width: 500px;
      margin: auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
    }
    label, input {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }
    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #ff3366;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .boton {
      background-color: #debaec;
      color: white;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
      transition: background 0.3s, transform 0.2s;
    }
    .boton:hover {
      background-color: #debaec;
      transform: scale(1.1);
    }
    .product-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .product {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 250px;
      text-align: center;
      padding: 15px;
    }
    .product img {
      width: 100%;
      border-radius: 8px;
    }
    .product h3 {
      font-size: 20px;
      color: #bb8fce;
    }
    .product p {
      font-size: 16px;
      color: #555;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: #d8a7a1;
    }
    .slide {
      display: none;
      width: 100%;
      height: 100vh;
      text-align: center;
      font-size: 2em;
      justify-content: center;
      align-items: flex-start;
      background-color: lightblue;
      padding-top: 40px;
    }
    .active {
      display: flex;
    }
    .btn {
      background-color: #ff3366;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      margin: 10px;
    }
  </style>
</head>
<body>
   <header>
    <div class="product-container">
      <a href="index.html" class="btn">Inicio</a>
      <a href="historia.html" class="btn">Conócenos</a>
      <a href="maquillaje.html" class="btn">Maquillaje</a>
      <a href="skinker.html" class="btn">Skincare</a>
      <a href="fragancias.html" class="btn">Fragancias</a>
      <a href="secion.html" class="btn">Únete</a>
      <a href="carritoo.html" class="btn">Carrito</a>
    </div>
  </header>
</body>
<body>
  <h1>Datos para el pago</h1>
  <form onsubmit="event.preventDefault(); alert('¡Pago procesado!');">
    <label>Nombre completo:</label>
    <input type="text" required>
    <label>Número de tarjeta:</label>
    <input type="text" maxlength="16" required>
    <label>Fecha de vencimiento:</label>
    <input type="month" required>
    <label>CVV:</label>
    <input type="text" maxlength="3" required>
    <label>Dirección de envío:</label>
    <input type="text" required>
    <button type="submit">Finalizar
    </button>
  </form>
</body>
